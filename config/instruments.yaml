# Solana memecoins: you trade a fixed $ amount per trade, long only.
# Memecoin slippage is LARGE and grows with trade size vs. pool liquidity.
# The paper trader measures real slippage from live Jupiter quotes - update these from it.
SOL_MEME:
  type: spot
  name: solana-memecoin
  notional_usd: 100
  fee_frac: 0.0025
  slip_frac: {entry: 0.01, stop: 0.02, target: 0.01, time: 0.01}
  fixed_usd_per_tx: 0.05
